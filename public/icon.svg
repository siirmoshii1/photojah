<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c3d30" />
      <stop offset="100%" stop-color="#0e1f18" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d87f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b1c" />
    </linearGradient>
    <linearGradient id="polaroidPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5efe4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Instant Photo (Polaroid) Ejecting from top -->
  <g transform="translate(186, 68) rotate(-6)" filter="url(#softShadow)">
    <rect width="140" height="170" rx="8" fill="url(#polaroidPaper)" />
    <!-- Photo Window -->
    <rect x="12" y="12" width="116" height="116" rx="4" fill="#2d3748" />
    <!-- Vintage Mountain & Sun in Photo -->
    <circle cx="85" cy="45" r="16" fill="#e5a93c" opacity="0.9" />
    <path d="M12 110 L50 65 L85 100 L105 82 L128 110 Z" fill="#4a5568" />
    <!-- Polaroid frame bottom subtle line -->
    <line x1="24" y1="145" x2="116" y2="145" stroke="#d5cebf" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Vintage Camera Body -->
  <g transform="translate(96, 175)" filter="url(#softShadow)">
    <!-- Base Body -->
    <rect width="320" height="240" rx="36" fill="#fdfbf7" />
    
    <!-- Top Vintage Brown Leatherette Band -->
    <path d="M0 36 Q0 0 36 0 L284 0 Q320 0 320 36 L320 74 L0 74 Z" fill="#3a2518" />
    
    <!-- Gold Trim Dividing Line -->
    <line x1="0" y1="74" x2="320" y2="74" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Red Vintage Shutter Button -->
    <g transform="translate(42, -14)">
      <rect width="36" height="16" rx="4" fill="#a83232" />
      <rect x="4" width="28" height="6" rx="2" fill="#d64545" />
    </g>

    <!-- Rangefinder Window -->
    <rect x="238" y="24" width="48" height="28" rx="6" fill="#1a202c" stroke="#d4af37" stroke-width="2" />
    <rect x="246" y="28" width="16" height="20" rx="3" fill="#2a4365" opacity="0.7" />

    <!-- Flash Reflector -->
    <circle cx="160" cy="38" r="16" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="3" />
    <circle cx="160" cy="38" r="8" fill="#fbbf24" opacity="0.85" />

    <!-- Photo Slot -->
    <rect x="80" y="222" width="160" height="6" rx="3" fill="#2d3748" />

    <!-- Central Big Vintage Lens -->
    <g transform="translate(160, 145)">
      <!-- Outer Brass Bezel -->
      <circle r="68" fill="url(#goldGrad)" />
      <!-- Textured Ring notches -->
      <circle r="60" fill="#222" />
      <circle r="56" fill="#14191c" />
      <circle r="46" fill="#1f2937" stroke="url(#goldGrad)" stroke-width="2" />
      <circle r="34" fill="#0f172a" />
      <!-- Glint -->
      <ellipse cx="-12" cy="-14" rx="14" ry="7" transform="rotate(-30, -12, -14)" fill="#ffffff" opacity="0.45" />
      <circle cx="12" cy="14" r="5" fill="#38bdf8" opacity="0.4" />
    </g>

    <!-- Brand Signature Typography on Camera Body -->
    <text x="50" y="160" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#786c5e" letter-spacing="2">PHOTOJAH</text>
    <text x="50" y="174" font-family="'Courier New', monospace" font-size="9" fill="#9c8e7e" letter-spacing="1">INSTANT CAM</text>
  </g>
</svg>
